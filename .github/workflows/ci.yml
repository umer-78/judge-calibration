name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/judgecal
          key: judgecal-helm-instruct-v1.0.0
      - run: pip install -e '.[dev]'
      - run: pytest -q
      # agreement, biases and calibration on the recorded judgments
      - run: python -m judgecal bench
