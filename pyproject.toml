[project]
name = "judge-calibration"
version = "0.1.0"
description = "Measure an LLM judge against human raters: weighted kappa, length and self-preference bias, calibration"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy==2.4.6", "scipy==1.17.1", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["judgecal"]

[tool.setuptools.package-data]
judgecal = ["rubric.yaml"]
